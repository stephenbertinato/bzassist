# Publishes a release for the version in gradle.properties.
#
# Push to main: if v<version> has no release yet, the jar is built and published, with the matching
# CHANGELOG section as the release notes. So "bump version, update the changelog, push" is a release.
#
# Pushing a tag v<version> does the same, and refuses a tag that disagrees with gradle.properties.

name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d ' ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in gradle.properties" >&2
            exit 1
          fi

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: make gradle wrapper executable
        if: steps.version.outputs.exists == 'false'
        run: chmod +x ./gradlew
      - name: build
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew build
      - name: cut the changelog section
        if: steps.version.outputs.exists == 'false'
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          cat notes.md
      - name: publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" build/libs/bzassist-*.jar \
            --title "BzAssist $version" \
            --notes-file notes.md
